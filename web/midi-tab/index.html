<!doctype html>
<html lang="pt-BR" data-theme="dark">
  <head>
    <meta charset="utf-8" /><!--MIDI_AUTH_CONTEXT--><link rel="stylesheet" href="/shared/auth.css"><script src="/shared/auth-guard.js"></script>
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <meta name="color-scheme" content="dark light" />
    <title>MIDI Tab Studio 3.1</title>
    <link rel="stylesheet" href="assets/css/app.css" />
  <link rel="stylesheet" href="/shared/network.css">
</head>
  <body>
    <header>
      <div class="brand">
        <div class="mark" aria-hidden="true">♬</div>
        <div>
          <h1>MIDI Tab <em>Studio</em></h1>
          <small data-i18n="brandSub"></small>
        </div>
      </div>
      <div class="preferences">
        <label
          ><span data-i18n="language"></span
          ><select id="language" aria-label="Language">
            <option value="pt-BR">Português BR</option>
            <option value="en">English</option>
          </select></label
        ><label
          ><span data-i18n="theme"></span
          ><select id="theme">
            <option value="dark" data-i18n="dark"></option>
            <option value="light" data-i18n="light"></option></select></label
        ><span class="offline" data-i18n="offline"></span>
      </div>
    </header>
    <main>
      <div class="intro">
        <div>
          <div class="eyebrow" data-i18n="eyebrow"></div>
          <h2 data-i18n="hero"></h2>
          <p data-i18n="heroSub"></p>
        </div>
        <div class="intro-art" aria-hidden="true">
          <span></span><span></span><span></span><span></span><span></span
          ><span></span><span></span><span></span><span></span><span></span
          ><span></span>
        </div>
      </div>
      <div class="layout">
        <aside class="panel settings">
          <div class="step" data-i18n="stepMusic"></div>
          <h3 data-i18n="importTitle"></h3>
          <div id="drop" class="drop">
            <div class="upload-icon" aria-hidden="true">↥</div>
            <strong data-i18n="dragMidi"></strong>
            <p data-i18n="midiOnly"></p>
            <button id="choose" data-i18n="chooseMidi"></button
            ><input
              id="file"
              type="file"
              accept=".mid,.midi,audio/midi"
              hidden
            /><small id="loadedName" data-i18n="maxFile"></small>
          </div>
          <button id="demo" class="full" data-i18n="demo"></button
          ><label class="field"
            ><span data-i18n="track"></span
            ><select id="track" disabled>
              <option data-i18n="importFirst"></option></select
          ></label>
          <div class="step spaced" data-i18n="stepInstrument"></div>
          <label class="field"
            ><span data-i18n="instrument"></span
            ><select id="preset"></select
          ></label>
          <p class="help" id="instrumentHint"></p>
          <label class="field"
            ><span data-i18n="tuning"></span
            ><input
              id="tuning"
              type="text"
              value="E4 B3 G3 D3 A2 E2"
              spellcheck="false"
          /></label>
          <p class="help" data-i18n="tuningHelp"></p>
          <div class="two">
            <label class="field"
              ><span data-i18n="frets"></span
              ><input
                id="frets"
                type="number"
                min="1"
                max="36"
                value="24" /></label
            ><label class="field"
              ><span data-i18n="transpose"></span
              ><input id="transpose" type="number" min="-48" max="48" value="0"
            /></label>
          </div>
          <details>
            <summary data-i18n="layoutSettings"></summary>
            <label class="field"
              ><span data-i18n="quantization"></span
              ><select id="quant">
                <option value="0" data-i18n="qOriginal"></option>
                <option value="1" data-i18n="qQuarter"></option>
                <option value="0.5" data-i18n="qEighth"></option>
                <option value="0.25" data-i18n="qSixteenth"></option>
                <option value="0.125" data-i18n="qThirtySecond"></option>
                <option
                  value="0.3333333333333333"
                  data-i18n="qTriplet"
                ></option></select></label
            ><label class="field"
              ><span data-i18n="start"></span
              ><select id="start">
                <option value="0" data-i18n="keepSilence"></option>
                <option
                  value="1"
                  data-i18n="trimSilence"
                ></option></select></label
            ><label class="field"
              ><span data-i18n="spacing"></span
              ><select id="density">
                <option value="180" data-i18n="normal"></option>
                <option value="260" data-i18n="wide"></option>
                <option
                  value="130"
                  data-i18n="compact"
                ></option></select></label
            ><label class="field"
              ><span data-i18n="title"></span
              ><input
                id="title"
                type="text"
                maxlength="100"
                value="Minha tablatura" /></label
            ><label class="field"
              ><span data-i18n="imagePage"></span
              ><select id="pngpage">
                <option value="0">1</option>
              </select></label
            >
          </details>
          <button
            id="convert"
            class="primary full"
            disabled
            data-i18n="generate"
          ></button>
          <p class="help" data-i18n="editHelp"></p>
          <details>
            <summary data-i18n="project"></summary>
            <div class="row spaced">
              <button id="saveProject" disabled data-i18n="saveProject"></button
              ><button id="openProject" data-i18n="openProject"></button
              ><input
                id="projectFile"
                type="file"
                accept=".json,.miditab"
                hidden
              />
            </div>
            <p class="help" data-i18n="projectHelp"></p>
          </details>
        </aside>
        <section class="panel studio">
          <div class="toolbar">
            <div>
              <div class="step" data-i18n="workspace"></div>
              <h3 data-i18n="scoreTitle"></h3>
            </div>
            <div class="row">
              <button id="undo" disabled data-i18n="undo"></button
              ><button id="pdf" disabled>↓ PDF</button
              ><button id="png" disabled>↓ PNG</button>
            </div>
          </div>
          <div class="stats">
            <div>
              <strong id="statnotes">—</strong><span data-i18n="notes"></span>
            </div>
            <div>
              <strong id="statbars">—</strong><span data-i18n="bars"></span>
            </div>
            <div>
              <strong id="statplaced">—</strong><span data-i18n="placed"></span>
            </div>
          </div>
          <div class="transport">
            <div class="accompaniment-panel">
              <label class="accompaniment-toggle"
                ><input id="accompaniment" type="checkbox" /><strong
                  data-i18n="accompaniment"
                ></strong
              ></label>
              <p
                id="accompanimentHint"
                class="help"
                data-i18n="accompanimentSolo"
              ></p>
              <div class="two">
                <label
                  ><span class="range-label"
                    ><span data-i18n="selectedVolume"></span
                    ><strong id="selectedVolumeLabel">100%</strong></span
                  ><input
                    id="selectedVolume"
                    type="range"
                    min="0"
                    max="100"
                    value="100"
                /></label>
                <label
                  ><span class="range-label"
                    ><span data-i18n="backingVolume"></span
                    ><strong id="backingVolumeLabel">60%</strong></span
                  ><input
                    id="backingVolume"
                    type="range"
                    min="0"
                    max="100"
                    value="60"
                    disabled
                /></label>
              </div>
            </div>
            <div class="transport-top">
              <div class="row">
                <button
                  id="play"
                  class="primary"
                  disabled
                  data-i18n="play"
                ></button
                ><button id="stop" disabled data-i18n="stop"></button>
              </div>
              <span id="clock" class="clock">00:00 / 00:00</span>
            </div>
            <div class="transport-controls">
              <label
                ><span data-i18n="tempoMode"></span
                ><select id="tempoMode">
                  <option value="original" data-i18n="tempoOriginal"></option>
                  <option
                    value="fixed"
                    data-i18n="tempoFixed"
                  ></option></select></label
              ><label
                ><span data-i18n="fixedBpm"></span
                ><input
                  id="bpm"
                  type="number"
                  min="20"
                  max="400"
                  value="120"
                  disabled /></label
              ><label
                ><span class="range-label"
                  ><span data-i18n="speed"></span
                  ><strong id="rateLabel">1,00×</strong></span
                ><input
                  id="speed"
                  type="range"
                  min="25"
                  max="200"
                  step="5"
                  value="100" /><small data-i18n="speedHelp"></small></label
              ><label
                ><span class="range-label"
                  ><span data-i18n="volume"></span
                  ><strong id="volumeLabel">70%</strong></span
                ><input
                  id="volume"
                  type="range"
                  min="0"
                  max="100"
                  value="70" /><small data-i18n="volumeHelp"></small
              ></label>
            </div>
            <div class="seek-row">
              <input
                id="seek"
                type="range"
                min="0"
                max="1000"
                value="0"
                step="1"
                disabled
                data-i18n-aria="seek"
              /><span id="currentBpm">— BPM</span>
            </div>
            <div class="checks">
              <label
                ><input id="metro" type="checkbox" /><span
                  data-i18n="metronome"
                ></span></label
              ><label
                ><input id="animate" type="checkbox" checked /><span
                  data-i18n="animation"
                ></span></label
              ><label
                ><input id="follow" type="checkbox" checked /><span
                  data-i18n="follow"
                ></span
              ></label>
            </div>
          </div>
          <div class="sound-panel">
            <div>
              <div class="step" data-i18n="soundLab"></div>
              <h4 data-i18n="compareSound"></h4>
            </div>
            <div class="sound-controls">
              <label
                ><span data-i18n="soundSource"></span
                ><select id="soundMode">
                  <option value="target" data-i18n="soundTarget"></option>
                  <option value="midi" data-i18n="soundMidi"></option>
                  <option value="custom" data-i18n="soundCustom"></option>
                  <option
                    value="simple"
                    data-i18n="soundSimple"
                  ></option></select></label
              ><button id="chooseSample" data-i18n="chooseSample"></button
              ><input
                id="sampleFile"
                type="file"
                accept=".wav,audio/wav,audio/x-wav"
                hidden
              /><label
                ><span data-i18n="sampleRoot"></span
                ><input
                  id="sampleRoot"
                  type="text"
                  value="C4"
                  spellcheck="false" /></label
              ><button id="audition" data-i18n="audition"></button>
            </div>
            <p id="soundHint" class="help"></p>
            <p id="sampleInfo" class="help" data-i18n="noSample"></p>
          </div>
          <div class="live-panel">
            <div class="live-heading">
              <strong data-i18n="liveStrings"></strong
              ><span id="liveNotes">—</span>
            </div>
            <canvas
              id="strings"
              width="1000"
              height="165"
              data-i18n-aria="liveStrings"
            ></canvas>
          </div>
          <div id="meta" class="meta"></div>
          <div
            id="status"
            class="status"
            role="status"
            aria-live="polite"
            data-i18n="ready"
          ></div>
          <div id="edit">
            <span id="editlabel"></span
            ><select
              id="positions"
              data-i18n-aria="alternativePosition"
            ></select>
            <div class="row">
              <button id="apply" class="primary" data-i18n="apply"></button
              ><button id="cancel" data-i18n="close"></button>
            </div>
          </div>
          <div id="pages" class="pages">
            <div class="empty">
              <div aria-hidden="true">≋</div>
              <h3 data-i18n="emptyTitle"></h3>
              <p data-i18n="emptyText"></p>
            </div>
          </div>
          <p class="below" data-i18n="scoreHelp"></p>
          <details>
            <summary data-i18n="limitsTitle"></summary>
            <p class="help" data-i18n="limits"></p>
            <p class="help" data-i18n="soundLimits"></p>
          </details>
        </section>
      </div>
    </main>
    <footer data-i18n="footer"></footer>
    <!-- Classic defer scripts deliberately support opening index.html via file://. -->
    <script defer src="assets/js/core/state.js"></script>
    <script defer src="assets/js/i18n/messages.js"></script>
    <script defer src="assets/js/i18n/errors.js"></script>
    <script defer src="assets/js/data/instruments.js"></script>
    <script defer src="assets/js/data/gm.js"></script>
    <script defer src="assets/samples/bank.js"></script>
    <script defer src="assets/js/core/midi.js"></script>
    <script defer src="assets/js/core/fingering.js"></script>
    <script defer src="assets/js/core/conversion.js"></script>
    <script defer src="assets/js/core/score.js"></script>
    <script defer src="assets/js/ui/renderer.js"></script>
    <script defer src="assets/js/audio/percussion.js"></script>
    <script defer src="assets/js/audio/sampler.js"></script>
    <script defer src="assets/js/audio/arrangement.js"></script>
    <script defer src="assets/js/audio/transport.js"></script>
    <script defer src="assets/js/exports/files.js"></script>
    <script defer src="assets/js/core/project.js"></script>
    <script defer src="assets/js/ui/animation.js"></script>
    <script defer src="assets/js/ui/app.js"></script>
  <script src="/shared/tab-bridge.js"></script>
<script src="/shared/lan-compat.js"></script>
<script src="/shared/network-api.js"></script>
<script src="/shared/network.js"></script>
<link rel="stylesheet" href="/shared/studio.css">
<script src="/shared/studio.js"></script>
</body>
</html>
